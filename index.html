<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Voice to Text</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;700&family=Amiri:wght@400;700&family=Almarai:wght@400;700&family=Noto+Kufi+Arabic:wght@400;700&display=swap">
<style>
:root{--bg:#f2f3fa;--s1:#fff;--s2:#e9eafc;--tx:#14162b;--mu:#666a8c;--bd:#dcdff2;--pri:#4f46e5;--pri2:#7c3aed;--on:#fff;--rec:#e5383b;--ok:#12a150;--out:#fafaff;--sh:0 6px 24px rgba(50,50,140,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d1c;--s1:#151831;--s2:#20244a;--tx:#eceeff;--mu:#9498c4;--bd:#272b52;--pri:#8b8cff;--on:#10122a;--out:#0e1026;--sh:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b0d1c;--s1:#151831;--s2:#20244a;--tx:#eceeff;--mu:#9498c4;--bd:#272b52;--pri:#8b8cff;--on:#10122a;--out:#0e1026;--sh:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font-family:Roboto,Cairo,system-ui,sans-serif}
html[lang=ar] body{font-family:Cairo,Roboto,system-ui,sans-serif}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:10px 12px 12px}
.bar{display:flex;align-items:center;justify-content:space-between;height:46px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:.2px}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;color:#fff}
.logo svg{width:20px;height:20px}
.acts{display:flex;gap:8px}
.ib{min-width:40px;height:40px;padding:0 10px;border-radius:20px;border:0;background:var(--s2);color:var(--tx);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.ib:active{transform:scale(.94)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh)}
.set{padding:10px 12px;display:grid;grid-template-columns:48px 1fr 1fr;gap:8px 10px;position:relative}
.set .w{grid-column:1/-1}
label{display:block;font-size:11px;font-weight:500;color:var(--mu);margin:0 2px 4px;text-transform:uppercase;letter-spacing:.5px}
html[lang=ar] label{text-transform:none;letter-spacing:0}
select{width:100%;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:14px;padding:0 8px}
input[type=range]{width:100%;height:40px;margin:0;accent-color:var(--pri)}
#cb{width:40px;height:40px;border-radius:50%;border:3px solid var(--s1);outline:2px solid var(--bd);cursor:pointer;background:#4f46e5;display:block;margin:0 auto}
#pop{display:none;position:absolute;top:calc(100% - 4px);inset-inline-start:8px;z-index:20;background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:12px;box-shadow:0 12px 32px rgba(0,0,0,.25);gap:10px;align-items:center}
#pop.open{display:flex}
#pop button,#pop .cu{width:32px;height:32px;border-radius:50%;border:2px solid var(--bd);padding:0;cursor:pointer}
.cu{position:relative;overflow:hidden;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.cu input{position:absolute;inset:-8px;width:60px;height:60px;opacity:0;cursor:pointer}
.main{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px}
#out{flex:1;min-height:0;overflow-y:auto;background:var(--out);border:1px dashed var(--bd);border-radius:16px;padding:14px;line-height:1.85;white-space:pre-wrap;word-break:break-word;user-select:text}
#out .int{opacity:.55}
#out.empty:before{content:attr(data-ph);color:var(--mu);font-size:14px}
.cur{display:inline-block;width:2px;height:1em;background:var(--pri);vertical-align:text-bottom;animation:b 1s steps(2) infinite;margin:0 2px}
@keyframes b{50%{opacity:0}}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);padding:8px 4px 0}
#tm{font-variant-numeric:tabular-nums;font-weight:500}
.ctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:2px 4px}
.tb{height:52px;border-radius:26px;border:0;background:var(--s2);color:var(--tx);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.tb.sv{background:var(--ok);color:#fff}
.tb:disabled{opacity:.38}
.tb:active:not(:disabled){transform:scale(.96)}
#rec{width:78px;height:78px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 10px 26px rgba(79,70,229,.5);position:relative;transition:.2s}
#rec svg{width:34px;height:34px}
#rec.on{background:var(--rec);box-shadow:0 10px 26px rgba(229,56,59,.5)}
#rec.on::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--rec);animation:p 1.3s infinite}
@keyframes p{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.35);opacity:0}}
#bd{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.25s;z-index:30}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--s1);border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:.3s;z-index:31}
body.sh #bd{opacity:1;pointer-events:auto}body.sh #sheet{transform:none}
.hd{width:38px;height:4px;border-radius:4px;background:var(--bd);margin:0 auto 12px}
.sht{font-weight:700;font-size:16px;margin:0 2px 12px;display:flex;align-items:center;gap:8px}
.sht i{font-style:normal;color:var(--ok)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g button{height:60px;border-radius:16px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-weight:600;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.g button b{font-size:18px}
.g button:active{transform:scale(.95)}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%) translateY(-30px);background:#14162b;color:#fff;padding:11px 18px;border-radius:30px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:99;max-width:90%;text-align:center}
.toast.s{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg></span><span data-i="title"></span></div>
    <div class="acts"><button class="ib" id="th" aria-label="Theme">🌙</button><button class="ib" id="ul">ع</button></div>
  </div>

  <div class="card set">
    <div class="w"><label data-i="speech"></label>
      <select id="lang">
        <option value="en-US">English (US)</option><option value="en-GB">English (UK)</option>
        <option value="ar-SA">العربية (السعودية)</option><option value="ar-EG">العربية (مصر)</option><option value="ar-MA">العربية (المغرب)</option><option value="ar-AE">العربية (الإمارات)</option>
        <option value="fr-FR">Français</option><option value="es-ES">Español</option><option value="de-DE">Deutsch</option><option value="tr-TR">Türkçe</option><option value="it-IT">Italiano</option><option value="pt-BR">Português</option><option value="ru-RU">Русский</option>
      </select></div>
    <div><label data-i="color"></label><button id="cb" aria-label="Color"></button></div>
    <div><label data-i="font"></label>
      <select id="fnt"><option value="Roboto">Roboto</option><option value="Cairo">Cairo</option><option value="Tajawal">Tajawal</option><option value="Amiri">Amiri</option><option value="Almarai">Almarai</option><option value="Noto Kufi Arabic">Kufi</option><option value="Georgia">Georgia</option><option value="monospace">Mono</option></select></div>
    <div><label><span data-i="size"></span>: <b id="szv">24</b></label><input type="range" id="sz" min="14" max="56" value="24"></div>
    <div id="pop"><span id="sw" style="display:contents"></span><span class="cu"><input type="color" id="col" value="#4f46e5"></span></div>
  </div>

  <div class="card main">
    <div id="out" class="empty"></div>
    <div class="meta"><span id="st"></span><span id="tm">00:00</span></div>
  </div>

  <div class="ctl">
    <button class="tb" id="clr" disabled data-i="clear"></button>
    <button id="rec" aria-label="Record"></button>
    <button class="tb sv" id="save" disabled data-i="save"></button>
  </div>
</div>

<div id="bd"></div>
<div id="sheet">
  <div class="hd"></div>
  <p class="sht"><i>✓</i><span data-i="exp"></span></p>
  <div class="g">
    <button data-x="png"><b>🖼</b>PNG</button><button data-x="jpeg"><b>🖼</b>JPG</button><button data-x="webp"><b>🖼</b>WEBP</button>
    <button data-x="pdf"><b>📄</b>PDF</button><button id="cp"><b>📋</b><span data-i="copy"></span></button><button id="sh"><b>↗</b><span data-i="share"></span></button>
  </div>
</div>
<div class="toast" id="ts"></div>

<script>
const $=s=>document.querySelector(s);
const out=$('#out'),recBtn=$('#rec'),st=$('#st');
const MIC='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>';
const STOP='<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3" fill="currentColor"/></svg>';
const T={en:{title:'Voice to Text',speech:'Speech language',color:'Color',font:'Font',size:'Size',ph:'Your words will appear here, letter by letter…',idle:'Tap the mic to start',live:'Listening… speak freely',stopped:'Stopped — ready to save',clear:'Clear',save:'Save',saved:'Saved ✓',exp:'Saved — export & share',copy:'Copy',share:'Share',copied:'Copied ✓',perm:'Please allow microphone access',nosup:'Speech recognition needs Chrome',prep:'Preparing…',done:'Exported: ',fail:'Export failed',err:'Error: '},
ar:{title:'صوتي إلى نص',speech:'لغة الكلام',color:'اللون',font:'الخط',size:'الحجم',ph:'سيظهر كلامك هنا حرفًا بحرف…',idle:'اضغط الميكروفون للبدء',live:'جارٍ الاستماع… تحدّث بحرية',stopped:'تم الإيقاف — جاهز للحفظ',clear:'مسح',save:'حفظ',saved:'تم الحفظ ✓',exp:'تم الحفظ — تصدير ومشاركة',copy:'نسخ',share:'مشاركة',copied:'تم النسخ ✓',perm:'يرجى السماح باستخدام الميكروفون',nosup:'التعرف على الصوت يحتاج Chrome',prep:'جارٍ التجهيز…',done:'تم التصدير: ',fail:'تعذّر التصدير',err:'خطأ: '}};
let L='en',sk='idle';
const tr=k=>T[L][k];
function i18n(){document.documentElement.lang=L;document.documentElement.dir='ltr';
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));
  out.dataset.ph=tr('ph');st.textContent=tr(sk);$('#ul').textContent=L==='ar'?'EN':'ع';document.title=tr('title')}
function setSt(k){sk=k;st.textContent=tr(k)}
$('#ul').onclick=()=>{L=L==='en'?'ar':'en';i18n()};
let dark=matchMedia('(prefers-color-scheme:dark)').matches;
function theme(){document.documentElement.dataset.theme=dark?'dark':'light';$('#th').textContent=dark?'☀️':'🌙'}
$('#th').onclick=()=>{dark=!dark;theme()};

let finalT='',interim='',on=false,rc=null,timer=null,want=false,t0=0,lastC=0;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
['#4f46e5','#e5383b','#12a150','#f59e0b','#0ea5e9','#111827','#ec4899'].forEach(c=>{const b=document.createElement('button');b.style.background=c;b.onclick=()=>{$('#col').value=c;style();$('#pop').classList.remove('open')};$('#sw').appendChild(b)});
$('#cb').onclick=e=>{e.stopPropagation();$('#pop').classList.toggle('open')};
$('#pop').onclick=e=>e.stopPropagation();
document.addEventListener('click',()=>$('#pop').classList.remove('open'));
$('#col').addEventListener('change',()=>$('#pop').classList.remove('open'));

function toast(m){const t=$('#ts');t.textContent=m;t.classList.add('s');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('s'),2300)}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rtl=()=>$('#lang').value.startsWith('ar');
const full=()=>(finalT+(interim?(finalT?' ':'')+interim:'')).trim();
function style(){
  $('#cb').style.background=$('#col').value;
  out.style.color=$('#col').value;out.style.fontFamily=`"${$('#fnt').value}",Cairo,system-ui,sans-serif`;
  out.style.fontSize=$('#sz').value+'px';out.dir=rtl()?'rtl':'ltr';$('#szv').textContent=$('#sz').value}
function render(){
  const has=full().length>0;
  out.classList.toggle('empty',!has&&!on);
  out.innerHTML=esc(finalT)+(interim?(finalT?' ':'')+'<span class="int">'+esc(interim)+'</span>':'')+(on?'<span class="cur"></span>':'');
  out.scrollTop=out.scrollHeight;
  $('#clr').disabled=!has||on;$('#save').disabled=!has||on}

const nz=w=>w.toLowerCase().replace(/[.,!?؟،;:"'«»()\-]/g,'');
// خوارزمية منع التكرار
function mergeText(b,s){
  s=(s||'').trim();if(!s)return b;if(!b)return s;
  const bw=b.split(/\s+/),sw=s.split(/\s+/),B=bw.map(nz),S=sw.map(nz);
  if(sw.length>1){const tail=' '+B.slice(-(sw.length+4)).join(' ')+' ';if(tail.includes(' '+S.join(' ')+' '))return b}
  else if(S[0]===B[B.length-1]&&Date.now()-lastC<1500)return b;
  for(let k=Math.min(B.length,S.length,60);k>=2;k--){
    if(B.slice(-k).join(' ')===S.slice(0,k).join(' '))return(b+' '+sw.slice(k).join(' ')).trim()}
  return b+' '+s}
function setup(){
  rc=new SR();rc.continuous=false;rc.interimResults=true;rc.maxAlternatives=1;rc.lang=$('#lang').value;
  let done=-1;
  rc.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i],tx=r[0].transcript.trim();
      if(r.isFinal){if(i>done){done=i;finalT=mergeText(finalT,tx);lastC=Date.now()}interim=''}
      else{const m=mergeText(finalT,tx);interim=m.startsWith(finalT)?m.slice(finalT.length).trim():tx}}
    render()};
  rc.onerror=e=>{
    if(e.error==='no-speech'||e.error==='aborted')return;
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){want=false;toast(tr('perm'));stop()}
    else if(e.error!=='network')toast(tr('err')+e.error)};
  rc.onend=()=>{
    if(interim){finalT=mergeText(finalT,interim);lastC=Date.now();interim=''}
    render();
    if(want)setTimeout(()=>{if(want){try{setup();rc.start()}catch(_){}}},200)};
}
function start(){
  if(!SR){toast(tr('nosup'));return}
  setup();want=true;on=true;document.body.classList.remove('sh');
  try{rc.start()}catch(_){}
  recBtn.classList.add('on');recBtn.innerHTML=STOP;setSt('live');$('#lang').disabled=true;t0=Date.now();
  timer=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('#tm').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500);
  render()}
function stop(){
  want=false;on=false;try{rc&&rc.stop()}catch(_){}
  if(interim){finalT=mergeText(finalT,interim);interim=''}
  recBtn.classList.remove('on');recBtn.innerHTML=MIC;clearInterval(timer);$('#lang').disabled=false;
  setSt(finalT?'stopped':'idle');render()}
recBtn.onclick=()=>on?stop():start();
$('#clr').onclick=()=>{finalT='';interim='';$('#tm').textContent='00:00';setSt('idle');render()};
['col','fnt','sz','lang'].forEach(i=>$('#'+i).addEventListener('input',style));
$('#save').onclick=()=>{
  try{const a=JSON.parse(localStorage.getItem('v2t')||'[]');a.unshift({t:finalT,d:Date.now()});localStorage.setItem('v2t',JSON.stringify(a.slice(0,50)))}catch(_){}
  document.body.classList.add('sh');toast(tr('saved'))};
$('#bd').onclick=()=>document.body.classList.remove('sh');

function lum(h){const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255))/255}
async function layout(pageH){
  const W=1080,P=80,fs=+$('#sz').value*1.7,lh=fs*1.75,fam=`"${$('#fnt').value}",Cairo,sans-serif`,col=$('#col').value,R=rtl();
  try{await document.fonts.load(`${fs}px ${fam}`,full())}catch(_){}
  const c=document.createElement('canvas').getContext('2d');c.font=`${fs}px ${fam}`;c.direction=R?'rtl':'ltr';
  const lines=[];let cur='';
  for(const w of full().split(/\s+/)){const t=cur?cur+' '+w:w;if(c.measureText(t).width>W-2*P&&cur){lines.push(cur);cur=w}else cur=t}
  if(cur)lines.push(cur);
  const per=pageH?Math.floor((pageH-2*P)/lh):lines.length,bg=lum(col)>.6?'#14172b':'#ffffff';
  const draw=(ls,H)=>{const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
    x.fillStyle=bg;x.fillRect(0,0,W,H);x.font=`${fs}px ${fam}`;x.fillStyle=col;x.direction=R?'rtl':'ltr';x.textAlign=R?'right':'left';x.textBaseline='top';
    ls.forEach((l,i)=>x.fillText(l,R?W-P:P,P+i*lh));return cv};
  if(!pageH)return[draw(lines,Math.max(420,Math.ceil(lines.length*lh+2*P)))];
  const pages=[];for(let i=0;i<lines.length;i+=per)pages.push(draw(lines.slice(i,i+per),pageH));return pages}
const toBlob=(cv,t)=>new Promise(r=>cv.toBlob(r,'image/'+t,.92));
function pdf(pages){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length};
  const obj=(id,f)=>{offs[id]=len;add(id+' 0 obj\n');f();add('\nendobj\n')};
  const n=pages.length;add('%PDF-1.4\n');
  obj(1,()=>add('<</Type/Catalog/Pages 2 0 R>>'));
  obj(2,()=>add('<</Type/Pages/Count '+n+'/Kids['+pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']>>'));
  pages.forEach((p,i)=>{const id=3+3*i,c='q 595 0 0 842 0 0 cm /Im0 Do Q';
    obj(id,()=>add(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</Im0 ${id+2} 0 R>>>>/Contents ${id+1} 0 R>>`));
    obj(id+1,()=>add(`<</Length ${c.length}>>\nstream\n${c}\nendstream`));
    obj(id+2,()=>{add(`<</Type/XObject/Subtype/Image/Width ${p.w}/Height ${p.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${p.d.length}>>\nstream\n`);add(p.d);add('\nendstream')})});
  const x=len,tot=3+3*n;add(`xref\n0 ${tot}\n0000000000 65535 f \n`);
  for(let i=1;i<tot;i++)add(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  add(`trailer\n<</Size ${tot}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'})}
async function deliver(blob,name){
  const f=new File([blob],name,{type:blob.type});
  if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast(tr('done')+name)}
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{
  const k=b.dataset.x;toast(tr('prep'));
  try{
    if(k==='pdf'){
      const cvs=await layout(1527),pg=[];
      for(const cv of cvs){const d=atob(cv.toDataURL('image/jpeg',.92).split(',')[1]);const u=new Uint8Array(d.length);for(let i=0;i<d.length;i++)u[i]=d.charCodeAt(i);pg.push({d:u,w:cv.width,h:cv.height})}
      await deliver(pdf(pg),'voice-text.pdf')}
    else{const [cv]=await layout(0);await deliver(await toBlob(cv,k),'voice-text.'+(k==='jpeg'?'jpg':k))}
  }catch(e){toast(tr('fail'))}});
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(full());toast(tr('copied'))}catch(_){const t=document.createElement('textarea');t.value=full();document.body.appendChild(t);t.select();try{document.execCommand('copy');toast(tr('copied'))}catch(__){}t.remove()}};
$('#sh').onclick=async()=>{if(navigator.share){try{await navigator.share({text:full()})}catch(_){}}else $('#cp').click()};

recBtn.innerHTML=MIC;theme();i18n();style();render();
</script>
</body>
</html>
