<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صوتي إلى نص</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Tajawal:wght@400;700&family=Amiri:wght@400;700&family=Almarai:wght@400;700&family=Noto+Kufi+Arabic:wght@400;700&display=swap">
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#161a2e;--mu:#6b7090;--bd:#e3e5f1;--ac:#5b5bf0;--ac2:#8b5cf6;--rec:#ef4444;--ok:#16a34a;--out:#fbfbfe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1020;--card:#171a30;--tx:#eef0ff;--mu:#9aa0c7;--bd:#262a48;--out:#0f1124}}
:root[data-theme="dark"]{--bg:#0e1020;--card:#171a30;--tx:#eef0ff;--mu:#9aa0c7;--bd:#262a48;--out:#0f1124}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tajawal,system-ui,sans-serif;min-height:100vh}
.app{max-width:520px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 14px}
h1{font-size:20px;font-weight:800;margin:0;display:flex;align-items:center;gap:8px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-size:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 4px 18px rgba(60,60,140,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:5px;font-weight:600}
select,input[type=color]{width:100%;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:14px;padding:0 10px}
input[type=color]{padding:3px}
input[type=range]{width:100%;accent-color:var(--ac);height:42px;margin:0}
.full{grid-column:1/-1}
.sw{display:flex;gap:8px;margin-top:8px}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);padding:0;cursor:pointer}
.recwrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 4px}
#rec{width:84px;height:84px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:34px;cursor:pointer;box-shadow:0 8px 24px rgba(91,91,240,.45);transition:.2s;position:relative}
#rec.on{background:var(--rec);box-shadow:0 8px 24px rgba(239,68,68,.5)}
#rec.on::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--rec);animation:p 1.3s infinite}
@keyframes p{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
#st{font-size:13px;color:var(--mu);min-height:18px}
#out{min-height:190px;max-height:46vh;overflow:auto;background:var(--out);border:1px dashed var(--bd);border-radius:16px;padding:14px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
#out .int{opacity:.55}
#out.empty:before{content:attr(data-ph);color:var(--mu);font-size:14px}
.cur{display:inline-block;width:2px;height:1em;background:var(--ac);vertical-align:text-bottom;animation:b 1s steps(2) infinite;margin:0 2px}
@keyframes b{50%{opacity:0}}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;height:46px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.btn.pri{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.97)}
#exp{display:none}
#exp.show{display:block}
.t{font-size:13px;font-weight:700;margin:0 0 4px;color:var(--mu)}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(30px);background:#111;color:#fff;padding:11px 18px;border-radius:30px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.s{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="app">
<header>
  <h1><span class="logo">🎙</span> صوتي إلى نص</h1>
  <span id="tm" style="color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums">00:00</span>
</header>

<section class="card">
  <div class="grid">
    <div class="full"><label>لغة النص</label>
      <select id="lang">
        <option value="ar-SA">العربية (السعودية)</option><option value="ar-EG">العربية (مصر)</option><option value="ar-MA">العربية (المغرب)</option><option value="ar-AE">العربية (الإمارات)</option>
        <option value="en-US">English (US)</option><option value="en-GB">English (UK)</option><option value="fr-FR">Français</option><option value="es-ES">Español</option><option value="de-DE">Deutsch</option><option value="tr-TR">Türkçe</option><option value="it-IT">Italiano</option><option value="pt-BR">Português</option><option value="ru-RU">Русский</option>
      </select></div>
    <div><label>لون النص</label><input type="color" id="col" value="#5b5bf0">
      <div class="sw" id="sw"></div></div>
    <div><label>الستايل (الخط)</label>
      <select id="fnt">
        <option value="Cairo">كايرو</option><option value="Tajawal">تجوّل</option><option value="Amiri">أميري (نسخ)</option><option value="Almarai">المراعي</option><option value="Noto Kufi Arabic">كوفي</option><option value="Georgia">Georgia</option><option value="monospace">Mono</option>
      </select></div>
    <div class="full"><label>الحجم: <b id="szv">24</b></label><input type="range" id="sz" min="14" max="56" value="24"></div>
  </div>
</section>

<section class="card">
  <div class="recwrap">
    <button id="rec" aria-label="تسجيل">🎙</button>
    <div id="st">اضغط للبدء بالتسجيل</div>
  </div>
</section>

<section class="card">
  <div id="out" class="empty" data-ph="سيظهر كلامك هنا حرفًا بحرف..."></div>
  <div class="row">
    <button class="btn" id="clr" disabled>مسح</button>
    <button class="btn pri" id="save" disabled>💾 حفظ</button>
  </div>
</section>

<section class="card" id="exp">
  <p class="t">تم الحفظ ✓ — التصدير والمشاركة</p>
  <div class="row"><button class="btn" data-x="png">صورة PNG</button><button class="btn" data-x="jpeg">صورة JPG</button><button class="btn" data-x="webp">صورة WEBP</button></div>
  <div class="row"><button class="btn" data-x="pdf">📄 PDF</button><button class="btn" id="cp">📋 نسخ</button><button class="btn" id="sh">↗ مشاركة</button></div>
</section>
</div>
<div class="toast" id="ts"></div>

<script>
const $=s=>document.querySelector(s);
const out=$('#out'),recBtn=$('#rec'),st=$('#st');
let finalT='',interim='',on=false,rc=null,t0=0,timer=null,want=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

['#5b5bf0','#ef4444','#16a34a','#f59e0b','#0ea5e9','#111827'].forEach(c=>{
  const b=document.createElement('button');b.style.background=c;b.onclick=()=>{$('#col').value=c;style()};$('#sw').appendChild(b)});

function toast(m){const t=$('#ts');t.textContent=m;t.classList.add('s');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('s'),2200)}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rtl=()=>$('#lang').value.startsWith('ar');
const full=()=>(finalT+(interim?(finalT?' ':'')+interim:'')).trim();

function style(){
  out.style.color=$('#col').value;out.style.fontFamily=`"${$('#fnt').value}",Cairo,system-ui,sans-serif`;
  out.style.fontSize=$('#sz').value+'px';out.dir=rtl()?'rtl':'ltr';$('#szv').textContent=$('#sz').value}
function render(){
  const has=full().length>0;
  out.classList.toggle('empty',!has&&!on);
  out.innerHTML=esc(finalT)+(interim?(finalT?' ':'')+'<span class="int">'+esc(interim)+'</span>':'')+(on?'<span class="cur"></span>':'');
  out.scrollTop=out.scrollHeight;
  $('#clr').disabled=!has||on;$('#save').disabled=!has||on}

function setup(){
  rc=new SR();rc.continuous=true;rc.interimResults=true;rc.maxAlternatives=1;rc.lang=$('#lang').value;
  rc.onresult=e=>{
    let it='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i],tx=r[0].transcript.trim();
      if(r.isFinal){if(tx)finalT+=(finalT?' ':'')+tx}else it+=(it?' ':'')+tx}
    interim=it;render()};
  rc.onerror=e=>{
    if(e.error==='no-speech'||e.error==='aborted')return;
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){want=false;toast('يرجى السماح باستخدام الميكروفون');stop()}
    else if(e.error!=='network')toast('خطأ: '+e.error)};
  rc.onend=()=>{ // لا يتوقف عند الصمت: إعادة التشغيل تلقائيًا
    if(want){setTimeout(()=>{try{rc.lang=$('#lang').value;rc.start()}catch(_){}},150)}};
}
function start(){
  if(!SR){toast('المتصفح لا يدعم التعرف على الصوت. استخدم Chrome');return}
  setup();want=true;on=true;$('#exp').classList.remove('show');
  try{rc.start()}catch(_){}
  recBtn.classList.add('on');recBtn.textContent='⏹';st.textContent='جارٍ الاستماع... تحدّث بحرية';
  $('#lang').disabled=true;t0=Date.now();
  timer=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('#tm').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500);
  render()}
function stop(){
  want=false;on=false;try{rc&&rc.stop()}catch(_){}
  if(interim){finalT+=(finalT?' ':'')+interim;interim=''}
  recBtn.classList.remove('on');recBtn.textContent='🎙';clearInterval(timer);$('#lang').disabled=false;
  st.textContent=finalT?'تم الإيقاف — يمكنك الحفظ الآن':'اضغط للبدء بالتسجيل';render()}
recBtn.onclick=()=>on?stop():start();
$('#clr').onclick=()=>{finalT='';interim='';$('#exp').classList.remove('show');$('#tm').textContent='00:00';render()};
['col','fnt','sz','lang'].forEach(i=>$('#'+i).addEventListener('input',style));

$('#save').onclick=()=>{
  try{const a=JSON.parse(localStorage.getItem('v2t')||'[]');a.unshift({t:finalT,d:Date.now()});localStorage.setItem('v2t',JSON.stringify(a.slice(0,50)))}catch(_){}
  $('#exp').classList.add('show');$('#exp').scrollIntoView({behavior:'smooth',block:'center'});toast('تم الحفظ ✓')};

// ---- Canvas rendering ----
function lum(h){const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255))/255}
async function layout(pageH){
  const W=1080,P=80,fs=+$('#sz').value*1.7,lh=fs*1.75,fam=`"${$('#fnt').value}",Cairo,sans-serif`,col=$('#col').value,R=rtl();
  try{await document.fonts.load(`${fs}px ${fam}`,full())}catch(_){}
  const c=document.createElement('canvas').getContext('2d');c.font=`${fs}px ${fam}`;c.direction=R?'rtl':'ltr';
  const lines=[];let cur='';
  for(const w of full().split(/\s+/)){const t=cur?cur+' '+w:w;if(c.measureText(t).width>W-2*P&&cur){lines.push(cur);cur=w}else cur=t}
  if(cur)lines.push(cur);
  const per=pageH?Math.floor((pageH-2*P)/lh):lines.length;
  const bg=lum(col)>.6?'#14172b':'#ffffff';
  const draw=(ls,H)=>{const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
    x.fillStyle=bg;x.fillRect(0,0,W,H);x.font=`${fs}px ${fam}`;x.fillStyle=col;x.direction=R?'rtl':'ltr';x.textAlign=R?'right':'left';x.textBaseline='top';
    ls.forEach((l,i)=>x.fillText(l,R?W-P:P,P+i*lh));return cv};
  if(!pageH)return[draw(lines,Math.max(420,Math.ceil(lines.length*lh+2*P)))];
  const pages=[];for(let i=0;i<lines.length;i+=per)pages.push(draw(lines.slice(i,i+per),pageH));return pages}
const toBlob=(cv,t)=>new Promise(r=>cv.toBlob(r,'image/'+t,.92));

function pdf(pages){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length};
  const obj=(id,f)=>{offs[id]=len;add(id+' 0 obj\n');f();add('\nendobj\n')};
  const n=pages.length;add('%PDF-1.4\n');
  obj(1,()=>add('<</Type/Catalog/Pages 2 0 R>>'));
  obj(2,()=>add('<</Type/Pages/Count '+n+'/Kids['+pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']>>'));
  pages.forEach((p,i)=>{const id=3+3*i,c='q 595 0 0 842 0 0 cm /Im0 Do Q';
    obj(id,()=>add(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</Im0 ${id+2} 0 R>>>>/Contents ${id+1} 0 R>>`));
    obj(id+1,()=>add(`<</Length ${c.length}>>\nstream\n${c}\nendstream`));
    obj(id+2,()=>{add(`<</Type/XObject/Subtype/Image/Width ${p.w}/Height ${p.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${p.d.length}>>\nstream\n`);add(p.d);add('\nendstream')})});
  const x=len,tot=3+3*n;add(`xref\n0 ${tot}\n0000000000 65535 f \n`);
  for(let i=1;i<tot;i++)add(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  add(`trailer\n<</Size ${tot}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'})}

async function deliver(blob,name){
  const f=new File([blob],name,{type:blob.type});
  if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('تم التصدير: '+name)}

document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{
  const k=b.dataset.x;toast('جارٍ التجهيز...');
  try{
    if(k==='pdf'){
      const cvs=await layout(1527),pg=[];
      for(const cv of cvs){const d=atob(cv.toDataURL('image/jpeg',.92).split(',')[1]);const u=new Uint8Array(d.length);for(let i=0;i<d.length;i++)u[i]=d.charCodeAt(i);pg.push({d:u,w:cv.width,h:cv.height})}
      await deliver(pdf(pg),'voice-text.pdf')}
    else{const [cv]=await layout(0);await deliver(await toBlob(cv,k),'voice-text.'+(k==='jpeg'?'jpg':k))}
  }catch(e){toast('تعذّر التصدير')}});

$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(full());toast('تم النسخ ✓')}catch(_){const t=document.createElement('textarea');t.value=full();document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('تم النسخ ✓')}catch(__){toast('تعذّر النسخ')}t.remove()}};
$('#sh').onclick=async()=>{if(navigator.share){try{await navigator.share({text:full()})}catch(_){}}else $('#cp').click()};

style();render();
if(!SR)st.textContent='⚠ يُفضّل فتح الصفحة في Chrome أو Safari الحديث';
</script>
</body>
</html>
